networks:
  django:
    driver: bridge

services:
  alloy-agent:
    image: grafana/alloy:v1.11.0
    container_name: alloy-agent
    restart: "no"
    command: ["run", "/etc/alloy/config.hcl"]
    environment:
      - ALLOY_LOKI_URL=https://monitoring.ebsworx.dev/loki/loki/api/v1/push
      - ALLOY_MIMIR_URL=https://monitoring.ebsworx.dev/mimir/api/v1/push
      - ALLOY_TEMPO_URL=https://monitoring.ebsworx.dev/tempo
      - ALLOY_AUTH_USERNAME=monitor
      - ALLOY_AUTH_PASSWORD=bmbm0WlJE9nRog
      - ALLOY_TLS_INSECURE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy.hcl:/etc/alloy/config.hcl:ro
      - ./alloy-data:/var/lib/alloy
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - django
    ports:
      # OTLP ingestion ports
      - "4317"
      - "4318"
      # (optional) Alloy debug UI port
      - "12345:12345"

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django-app
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: alloy.settings
      OTEL_SERVICE_NAME: django-test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy-agent:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.1"
    networks:
      - django
    ports:
      - "8000:8000"
